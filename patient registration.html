<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Online Patient Registration-Patholiv Lab</h1>
        <p>Clinical Laboratory Management System</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="test-details.html">Test Details</a>
        <a href="test-price-table.html">Price List</a>
        <a href="patient-registration.html">Registration</a>
        <a href="gallery.html">Gallery</a>
    </nav>
    <main class="content">

        <form>

            <fieldset>
                <legend>Patient Information</legend>

                <label>Patient Name:</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Age:</label>
                <input type="number" min="1" max="120" placeholder="Enter age" required>

                <label>Gender:</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <label>Mobile Number:</label>
                <input type="tel" placeholder="Enter mobile number" pattern="[0-9]{10}" required>

                <label>Email:</label>
                <input type="email" placeholder="Enter email" required>

                <label>Date of Birth:</label>
                <input type="date" required>

            </fieldset>

            <fieldset>
                <legend>Test Information</legend>

                <label>Select Laboratory Test:</label>
                <select required>
                    <option value="">Select Test</option>
                    <option>Complete Blood Count (CBC)</option>
                    <option>Urine Routine Test</option>
                    <option>Uric Acid Test</option>
                    <option>Thyroid Profile</option>
                </select>

                <label>Preferred Appointment Date:</label>
                <input type="date" required>

                <label>Sample Collection Preference:</label>
                <select required>
                    <option value="">Select Preference</option>
                    <option>Visit Laboratory</option>
                    <option>Home Collection</option>
                </select>

                <label>Upload Doctor Prescription:</label>
                <input type="file">

            </fieldset>

            <button type="submit">Register Now</button>

        </form>

    </main>

    <footer>
        <p>
            &copy; 2026 Clinical Laboratory Management System.
            All Rights Reserved.
        </p>
    </footer>

</body>

</html>
